<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#4a1b12"/>
      <stop offset="45%" stop-color="#2a1109"/>
      <stop offset="100%" stop-color="#0a0605"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e0ad"/>
      <stop offset="55%" stop-color="#cda766"/>
      <stop offset="100%" stop-color="#9c7538"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff1b0"/>
      <stop offset="35%" stop-color="#ff8a2a"/>
      <stop offset="75%" stop-color="#d8241a"/>
      <stop offset="100%" stop-color="#7a0f0a"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- фон -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="150" fill="url(#ember)"/>

  <!-- декоративное кольцо -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#0a0605" stroke-width="4" opacity="0.7"/>

  <!-- рога -->
  <g fill="url(#gold)" stroke="#7a5a2a" stroke-width="2">
    <path d="M180,178 C126,150 96,104 100,52 C152,86 200,116 232,150 Z"/>
    <path d="M332,178 C386,150 416,104 412,52 C360,86 312,116 280,150 Z"/>
  </g>

  <!-- череп -->
  <g stroke="#7a5a2a" stroke-width="2">
    <ellipse cx="256" cy="232" rx="116" ry="108" fill="url(#gold)"/>
    <path d="M162,300 C168,350 206,392 256,392 C306,392 344,350 350,300 Z" fill="url(#gold)"/>
  </g>

  <!-- скулы (тень) -->
  <g fill="#160a07" opacity="0.55">
    <circle cx="196" cy="318" r="26"/>
    <circle cx="316" cy="318" r="26"/>
  </g>

  <!-- горящие глаза -->
  <g stroke="#5a0d08" stroke-width="3">
    <path d="M182,206 L252,238 L212,270 Z" fill="url(#eye)"/>
    <path d="M330,206 L260,238 L300,270 Z" fill="url(#eye)"/>
  </g>

  <!-- нос -->
  <path d="M256,258 L238,304 L256,294 L274,304 Z" fill="#160a07"/>

  <!-- рот и зубы -->
  <rect x="206" y="330" width="100" height="20" rx="8" fill="#160a07"/>
  <g fill="url(#gold)">
    <rect x="214" y="332" width="13" height="26" rx="3"/>
    <rect x="233" y="332" width="13" height="30" rx="3"/>
    <rect x="252" y="332" width="13" height="30" rx="3"/>
    <rect x="271" y="332" width="13" height="30" rx="3"/>
    <rect x="290" y="332" width="8" height="24" rx="3"/>
  </g>
</svg>
